# cargo-deny policy for the Soroban contract workspace.
# Run locally with: make audit-rust
# Docs: https://embarkstudios.github.io/cargo-deny/

[advisories]
version = 2
yanked = "deny"
# Each ignore needs a rationale and an expiry comment; see docs/dependency-policy.md.
ignore = []

[licenses]
version = 2
# MIT-licensed protocol: only permissive licences may enter the tree. A copyleft
# dependency (GPL/AGPL/MPL) is a licence-compatibility break, not a warning.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
confidence-threshold = 0.9

[bans]
# Duplicate versions bloat the wasm artefact, which is size-capped on Soroban.
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
