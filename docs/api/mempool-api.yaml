openapi: 3.1.0

info:
  title: Perihelion Mempool API
  version: 1.0.0
  contact:
    name: Perihelion Protocol
    url: https://github.com/Perihelion-Protocol/Perihelion
  description: |
    The Perihelion Mempool API is the HTTP surface through which clients
    submit signed intents, query their lifecycle status, and list intents
    by status.

    ## Intent lifecycle

    The full cross-chain intent lifecycle (as modeled by the SDK and the
    on-chain contracts) has six states:

    ```
    pending → claimed → settling → settled
           ↘                    ↘
            expired              refunded
    ```

    | Status     | Meaning                                                      |
    |------------|--------------------------------------------------------------|
    | `pending`  | Signed, in the mempool, unclaimed by any solver              |
    | `claimed`  | A solver has locked the source-chain funds                   |
    | `settling` | Cross-chain LayerZero message is in flight                   |
    | `settled`  | Assets released on Stellar; bridge complete                  |
    | `refunded` | Solver-initiated refund after a failed or cancelled fill     |
    | `expired`  | Deadline passed before any solver claimed the intent         |

    **This mempool's `IntentStatus` only covers four of those six states:**
    `pending`, `settled`, `refunded`, `expired`. `claimed` and `settling` are
    part of the broader on-chain/SDK lifecycle but are never assigned by this
    reference implementation — solvers and the relayer currently track those
    intermediate states out-of-band. Tracked by issue #294 (SDK rejects the
    mempool's `IntentRecord` shape) and issue #321 (no endpoint mutates
    status at all, see "Status ownership" below).

    ## Status ownership

    No endpoint in this API transitions an intent's status. The reference
    `MempoolServer` exposes an in-process `updateStatus(hash, status)` method
    used by test harnesses and local relayer/solver wiring, but it is **not**
    reachable over HTTP — there is currently no documented or authenticated
    way for a solver or relayer to report progress via this API. Tracked by
    issue #321.

    ## Pagination

    `GET /intents` accepts optional `limit` and `offset` query parameters.
    When neither is supplied, the endpoint preserves its original behavior of
    returning every matching record in a single array response. When
    supplied, the response is the same flat `IntentRecord[]` array, sliced to
    the requested page — there is no envelope object and no total count.

    ## Error responses

    All error responses share the shape `{ "error": "<message>" }` and use
    standard HTTP status codes.

    **Known gaps** (each tracked by its own issue, not yet part of this
    contract):
    - Duplicate submission: `POST /intents` currently overwrites the existing
      record for a hash that has already been submitted (last write wins) and
      returns `200`, rather than rejecting the second submission with `409`.
      Tracked by issue #320.
    - Malformed `:hash` path parameter: `GET /intents/{hash}` performs no
      format validation on the path parameter; any string is accepted and a
      value that does not match a stored record simply falls through to the
      documented `404`. Tracked by issue #348.

servers:
  - url: http://localhost:3000
    description: Local development server (default port)

tags:
  - name: Intents
    description: Submit and query cross-chain bridge intents
  - name: Discovery
    description: Server metadata and EIP-712 domain discovery

paths:

  /intents:

    post:
      operationId: submitIntent
      tags: [Intents]
      summary: Submit a signed intent
      description: |
        Validates the EIP-712 signature over the intent, computes the canonical
        `intent_hash`, and stores the record with status `pending`.

        The server rejects the submission if the signature is invalid or any
        required field is missing (`400`).

        **Duplicate submissions are not currently rejected.** If an intent
        with the same hash has already been submitted, this call overwrites
        the stored record (last write wins) and still returns `200`. A
        strict `409 Conflict` check is tracked separately by issue #320 and
        is not yet part of this contract.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignedIntent'
            example:
              intent:
                user: "0xd8dA6BF26964aF9D7eEd9e03E53415D37aA96045"
                destination: "GBBD47IF6LWK7P7MDEVSCWR7DPUWV3NY3DTQEVFL4NAT4AQH3ZLLFLA5"
                sourceChainId: 8453
                sourceAsset: "0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913"
                sourceAmount: "1000000"
                destAsset: "USDC:GA5ZSEJYB37JRC5AVCIA5MOP4RHTM335X2KGX3IHOJAPP5RE34K4KZVN"
                minDestAmount: "9900000"
                deadline: 1751280000
                nonce: "95395590780195993686340100862393633005949636859136019347794446361576576451305"
                preferredSolver: "0x0000000000000000000000000000000000000000"
              signature: "0xabcdef1234567890abcdef1234567890abcdef1234567890abcdef1234567890abcdef1234567890abcdef1234567890abcdef1234567890abcdef1234567890ab1c"
              hash: "0x1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e0f1a2b"
      responses:
        '200':
          description: |
            Intent accepted and stored; returns the canonical intent hash.
            Also returned when overwriting a prior submission with the same
            hash (see the duplicate-submission note above).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitIntentResponse'
              example:
                hash: "0x1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e0f1a2b"
        '400':
          description: |
            Validation failure — missing required fields or invalid EIP-712
            signature.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missingFields:
                  summary: Missing intent or signature
                  value:
                    error: "Missing intent or signature"
                invalidSignature:
                  summary: Invalid EIP-712 signature
                  value:
                    error: "Invalid signature"
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Internal server error"

    get:
      operationId: listIntents
      tags: [Intents]
      summary: List intents, optionally filtered by status and/or chain
      description: |
        Returns intent records in the mempool. All query parameters are
        optional and may be combined; results are filtered first, then
        paginated.
      parameters:
        - name: status
          in: query
          required: false
          description: |
            Filter results to intents in this lifecycle state. When omitted,
            intents in any status are returned. An unrecognized value
            returns `400`.
          schema:
            $ref: '#/components/schemas/IntentStatus'
        - name: chainId
          in: query
          required: false
          description: |
            Filter results to intents whose `intent.sourceChainId` equals
            this value. Useful for a mempool instance that may see intents
            destined for more than one source chain's escrow.
          schema:
            type: integer
          example: 8453
        - name: limit
          in: query
          required: false
          description: |
            Maximum number of records to return, applied after filtering and
            after `offset`. Omit to return every remaining matching record.
          schema:
            type: integer
            minimum: 0
        - name: offset
          in: query
          required: false
          description: |
            Number of matching records to skip before collecting `limit`
            results. Defaults to `0`.
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Array of intent records (may be empty).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IntentRecord'
        '400':
          description: The `status` query parameter is not a recognized `IntentStatus` value.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Invalid status filter: 'bogus' (expected one of pending, settled, refunded, expired)"

  /intents/{hash}:

    get:
      operationId: getIntent
      tags: [Intents]
      summary: Get an intent record by hash
      description: |
        Retrieves the full `IntentRecord` for the given `intent_hash`,
        including current lifecycle status and any solver/settlement metadata
        that has been attached since submission.

        The path parameter is not format-validated against the `Hex` pattern
        (see issue #348); a malformed hash is simply treated as unknown and
        falls through to the `404` response below, the same as any other
        hash with no matching record.
      parameters:
        - name: hash
          in: path
          required: true
          description: |
            The canonical EIP-712 `intent_hash` that identifies this intent,
            as returned by `POST /intents` or computed locally by the SDK
            `hashIntent` function.
          schema:
            $ref: '#/components/schemas/Hex'
          example: "0x1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e0f1a2b"
      responses:
        '200':
          description: The intent record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntentRecord'
        '404':
          description: |
            No intent with the given hash exists in the mempool. Also
            returned for a syntactically invalid hash, since the path
            parameter is not validated (see description above).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Intent not found"

  /info:

    get:
      operationId: getInfo
      tags: [Discovery]
      summary: Discover the EIP-712 domain this mempool instance verifies against
      description: |
        Returns the EIP-712 domain (`name`, `version`, `chainId`,
        `verifyingContract`) this mempool instance was configured with. A
        client can use this to confirm it is signing intents against the
        same chain/escrow the mempool will accept, without hard-coding the
        values out of band.
      responses:
        '200':
          description: The mempool's configured EIP-712 domain.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MempoolInfo'
              example:
                name: "Perihelion"
                version: "1"
                chainId: 8453
                verifyingContract: "0x0000000000000000000000000000000000000000"

components:
  schemas:

    # ─── Primitive types ────────────────────────────────────────────────────

    Address:
      type: string
      description: |
        An EVM address: 20 bytes encoded as a `0x`-prefixed hex string,
        optionally EIP-55 checksummed.
      pattern: '^0x[0-9a-fA-F]{40}$'
      examples:
        - "0xd8dA6BF26964aF9D7eEd9e03E53415D37aA96045"
        - "0x0000000000000000000000000000000000000000"

    Hex:
      type: string
      description: |
        An arbitrary-length `0x`-prefixed hex string. Used for the intent hash,
        signature, and nonce fields.
      pattern: '^0x[0-9a-fA-F]+$'
      examples:
        - "0x1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e0f1a2b"

    IntentStatus:
      type: string
      description: |
        Lifecycle state of an intent as tracked by this mempool. This is a
        subset of the full on-chain/SDK lifecycle — see the "Intent
        lifecycle" note above for `claimed`/`settling`, which this
        implementation never assigns.
      enum:
        - pending
        - settled
        - refunded
        - expired

    # ─── Core domain schemas ────────────────────────────────────────────────

    Intent:
      type: object
      description: |
        The canonical, signable description of what a user wants: spend a known
        asset/amount on a source EVM chain and receive at least `minDestAmount`
        of a target asset on Stellar before `deadline`.

        All numeric amounts are **decimal strings** in the asset's smallest
        unit to preserve full precision.
      required:
        - user
        - destination
        - sourceChainId
        - sourceAsset
        - sourceAmount
        - destAsset
        - minDestAmount
        - deadline
        - nonce
        - preferredSolver
      properties:
        user:
          $ref: '#/components/schemas/Address'
          description: EVM address of the user funding the source leg (the EIP-712 signer).
        destination:
          type: string
          description: |
            Stellar address that will receive the settled assets. Either a
            `G...` (account strkey) or `C...` (contract strkey), or `"native"`
            for the native XLM asset destination.
          examples:
            - "GBBD47IF6LWK7P7MDEVSCWR7DPUWV3NY3DTQEVFL4NAT4AQH3ZLLFLA5"
        sourceChainId:
          type: integer
          description: |
            EVM chain ID of the source network the user spends from.
            Common values: `1` (Ethereum mainnet), `8453` (Base),
            `42161` (Arbitrum One).
          examples:
            - 8453
        sourceAsset:
          $ref: '#/components/schemas/Address'
          description: ERC-20 token address being spent on the source chain.
        sourceAmount:
          type: string
          description: |
            Amount of `sourceAsset` the user locks, in the asset's smallest
            unit (decimal string, e.g. `"1000000"` for 1 USDC with 6 decimals).
          pattern: '^[0-9]+$'
          examples:
            - "1000000"
        destAsset:
          type: string
          description: |
            Asset the user wants to receive on Stellar.
            - `"native"` for XLM
            - `"<CODE>:<ISSUER_G...>"` for an issued asset
          examples:
            - "USDC:GA5ZSEJYB37JRC5AVCIA5MOP4RHTM335X2KGX3IHOJAPP5RE34K4KZVN"
            - "native"
        minDestAmount:
          type: string
          description: |
            Minimum acceptable amount of `destAsset` in its smallest unit
            (slippage floor). The solver must deliver at least this amount or
            the settlement is rejected.
          pattern: '^[0-9]+$'
          examples:
            - "9900000"
        deadline:
          type: integer
          description: |
            Unix timestamp (seconds) after which the intent is void and
            source-chain funds become refundable.
          examples:
            - 1751280000
        nonce:
          type: string
          description: |
            Unique value preventing replay or collision of otherwise-identical
            intents; encoded on-chain as a `uint256`. **Not** a `0x`-prefixed
            hex string in practice: the SDK's default generator
            (`randomNonce`) produces a base-10 decimal-digit string. A
            `0x`-prefixed hex string is also accepted on submission (the SDK
            parses it with `BigInt(...)`), but is not what callers get by
            default — treat this as "any string `BigInt()` can parse",
            not as `Hex`.
          pattern: '^(0x[0-9a-fA-F]+|[0-9]+)$'
          examples:
            - "95395590780195993686340100862393633005949636859136019347794446361576576451305"
        preferredSolver:
          $ref: '#/components/schemas/Address'
          description: |
            Optional solver address granted exclusive fill rights. Set to the
            zero address (`0x0000...0000`) for an open, competitive auction.

    SignedIntent:
      type: object
      description: |
        An `Intent` together with its EIP-712 signature and the canonical
        `intent_hash` that serves as the mempool and on-chain identifier.
      required:
        - intent
        - signature
        - hash
      properties:
        intent:
          $ref: '#/components/schemas/Intent'
        signature:
          $ref: '#/components/schemas/Hex'
          description: |
            EIP-712 signature over the intent by `intent.user`. Must be a
            valid 65-byte (`r`, `s`, `v`) compact hex string.
        hash:
          $ref: '#/components/schemas/Hex'
          description: |
            keccak256 EIP-712 commitment of the intent — the primary mempool
            and on-chain identifier. Computed by the SDK `hashIntent` function.
            The server recomputes this value itself from `intent`; a
            mismatched client-supplied `hash` is not currently rejected.

    IntentRecord:
      allOf:
        - $ref: '#/components/schemas/SignedIntent'
        - type: object
          description: |
            A `SignedIntent` enriched with lifecycle metadata maintained by
            the mempool server.
          required:
            - status
            - submittedAt
          properties:
            status:
              $ref: '#/components/schemas/IntentStatus'
            solver:
              $ref: '#/components/schemas/Address'
              description: |
                EVM address of the solver that claimed the intent.
                Reserved for future use — no endpoint currently sets this
                field (see "Status ownership" above).
            settlementTx:
              type: string
              description: |
                Stellar transaction hash of the settlement operation.
                Reserved for future use — no endpoint currently sets this
                field (see "Status ownership" above).
              examples:
                - "a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1b2"
            submittedAt:
              type: integer
              description: |
                Unix timestamp **in milliseconds** (`Date.now()`) at which the
                record was created. Named `submittedAt` to match the
                reference server's wire format; note that the SDK's
                `IntentRecord` type currently expects a field named
                `createdAt` in seconds instead, which is why
                `parseIntentRecord` rejects every response this mempool
                produces (tracked by issue #294 — not yet reconciled).
              examples:
                - 1751270400000

    # ─── Request / response envelopes ──────────────────────────────────────

    SubmitIntentResponse:
      type: object
      description: Successful response body from `POST /intents`.
      required:
        - hash
      properties:
        hash:
          $ref: '#/components/schemas/Hex'
          description: |
            The canonical `intent_hash` computed by the server.  Clients
            should verify this matches their locally-computed hash before
            storing the value.

    MempoolInfo:
      type: object
      description: |
        The EIP-712 domain this mempool instance verifies intent signatures
        against, as returned by `GET /info`.
      required:
        - name
        - version
        - chainId
        - verifyingContract
      properties:
        name:
          type: string
          description: EIP-712 domain name. Fixed to `"Perihelion"` by the SDK's `perihelionDomain` helper.
          examples:
            - "Perihelion"
        version:
          type: string
          description: EIP-712 domain version. Fixed to `"1"` by the SDK's `perihelionDomain` helper.
          examples:
            - "1"
        chainId:
          type: integer
          description: EVM chain ID this mempool instance's escrow is deployed on.
          examples:
            - 8453
        verifyingContract:
          $ref: '#/components/schemas/Address'
          description: PerihelionEscrow contract address this mempool instance verifies signatures against.

    ErrorResponse:
      type: object
      description: |
        Standard error envelope returned for 4xx and 5xx responses.
      required:
        - error
      properties:
        error:
          type: string
          description: Human-readable description of the error.
          examples:
            - "Missing intent or signature"
            - "Invalid signature"
            - "Intent not found"
            - "Invalid status filter: 'bogus' (expected one of pending, settled, refunded, expired)"
            - "Internal server error"
